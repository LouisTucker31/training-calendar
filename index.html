<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages can't set custom HTTP response headers (a static host,
     no server config available), so CSP is set here via meta tag instead
     - the documented fallback when header-based CSP isn't available.
     Note this can't set every directive a real header could (e.g.
     frame-ancestors, which silently has no effect in a meta tag).

     style-src includes 'unsafe-inline' because this app sets per-event/
     palette colours directly via el.style.* and a --dot-color custom
     property (script.js), rather than through a fixed set of CSS
     classes - there's no static class for "this event's colour" since
     colours come from Supabase data. script-src has no such exception:
     every script here is same-origin, so 'self' alone covers it, and
     that's the directive that actually stops an injected <script> from
     running if XSS is ever found elsewhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://vumsggojkacntpzhprqh.supabase.co; base-uri 'self'; form-action 'self'">
<title>2026–27 Training Event Calendar</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="liquid-glass-toolbar.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<!-- iOS ignores the manifest for home-screen install behaviour, so these
     are required separately for it to launch full-screen with its own
     icon instead of as a bookmarked Safari tab. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Cal">
<meta name="theme-color" content="#1c1e21">
</head>
<body>

<div class="range-header">
  <div class="range-header-top">
    <h1>2026–27 Training Event Calendar</h1>
    <button type="button" id="event-list-trigger" aria-label="Show events and pace settings" aria-haspopup="dialog" aria-expanded="false">
      <!-- Lucide "menu" icon - kept in sync with the ICONS.menu entry in
           script.js, which is what every other icon in the app is
           rendered from; this one has to stay static markup since it's
           visible before any JS runs. -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" x2="20" y1="6" y2="6"></line>
        <line x1="4" x2="20" y1="12" y2="12"></line>
        <line x1="4" x2="20" y1="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>

<div id="calendar"></div>
<div id="day-view" hidden></div>

<!-- Liquid glass "today" toolbar: the left circle toggles month/day view
     (icon filled in by script.js's setView, matching the ICONS set
     every other icon in the app uses), the right circle stays
     decorative (no icon, no function - kept purely for the three-piece
     glass look), and the centre pill is the app's today button. Hidden
     by default; script.js reveals it once there's a workout/rest-day
     summary to show for today, same as the pill this replaces. -->
<div class="lg-toolbar" id="today-toolbar" role="presentation" hidden>
  <button type="button" class="lg-toolbar__circle lg-surface" id="view-toggle" aria-pressed="false">
    <span class="lg-surface__lens" aria-hidden="true"></span>
    <span class="lg-surface__frost" aria-hidden="true"></span>
    <span class="lg-toolbar__circle-icon" id="view-toggle-icon"></span>
  </button>

  <button type="button" class="lg-toolbar__pill lg-surface" id="today-pill">
    <span class="lg-surface__lens" aria-hidden="true"></span>
    <span class="lg-surface__frost" aria-hidden="true"></span>
    <span class="today-pill-label" id="today-pill-label"></span>
  </button>

  <div class="lg-toolbar__circle lg-surface" aria-hidden="true">
    <span class="lg-surface__lens" aria-hidden="true"></span>
    <span class="lg-surface__frost" aria-hidden="true"></span>
  </div>
</div>

<script src="data.js"></script>
<script src="supabase.js"></script>
<script src="liquid-glass-toolbar.js"></script>
<script src="script.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      // updateViaCache: "none" stops the browser HTTP-caching sw.js itself
      // (GitHub Pages serves it with a 10 min max-age by default), so every
      // registration check actually re-fetches the current file instead of
      // silently reusing a stale one - this matters most for an installed
      // iOS home-screen PWA, which otherwise rarely re-checks on its own.
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
        // sw.js itself calls self.skipWaiting() on install, so a new
        // service worker takes over as soon as it's installed rather than
        // waiting for every old tab to close - that's what triggers the
        // controllerchange reload below. Explicitly asking for an update
        // check here means a stale install (e.g. an iOS home-screen PWA
        // that rarely re-checks on its own) picks up changes on its next
        // open instead of only whenever the browser feels like checking.
        reg.update().catch(() => {});
      }).catch(() => {
        // Registration failing (e.g. served over plain http, or the file
        // 404s on a host that doesn't preserve it) shouldn't break the
        // page - the app still works fully online without it.
      });

      // Once the new service worker takes control, reload once so the page
      // is running the code that matches it (avoids a half-updated state
      // where old JS is still loaded under a new SW).
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
