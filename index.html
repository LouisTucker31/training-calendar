<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026–27 Training Event Calendar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="range-header">
  <div class="range-header-top">
    <h1>2026–27 Training Event Calendar</h1>
    <button type="button" id="event-list-trigger" aria-label="Show event list" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>
  </div>
  <p>Scroll to move through the range · tap any day for its event or training details</p>
</div>

<div id="calendar"></div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
